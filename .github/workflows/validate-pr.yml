name: Validate Training OS PR

on:
  pull_request:
    branches: [main, codex/pr-s1-data-durability]
    types: [opened, synchronize, reopened, ready_for_review]

# Unspecified token permissions are disabled. Never use pull_request_target here.
permissions:
  contents: read

concurrency:
  group: training-os-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR candidate HEAD
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          # Pinned baseline is executed by the durability regression harness.
          fetch-depth: 0

      # Match release-pages.yml: Python 3.12 and runner-provided Node.
      # The existing suites require no package installation.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record runtime versions
        run: |
          python --version
          node --version

      - name: Validate release and static contract
        run: python scripts/validate_release.py

      - name: Offline shell contract
        run: |
          python3 scripts/build_offline.py --check
          node tests/offline_contract.test.js

      - name: Test training engine
        run: node scripts/test_engine.js

      - name: Test UI static integrity
        run: node scripts/test_ui_static.js

      - name: Reliability regression gate
        run: python3 scripts/test_reliability_rc621.py

      - name: Data durability failure-injection gate
        run: node tests/storage_durability.test.js

      - name: M5 explicit-load regression gate
        run: node tests/m5_load.test.js

      - name: Superset-skip core regression gate
        run: node tests/superset_skip.test.js

      - name: Release safety controls
        run: node tests/release_controls.test.js

      - name: Install pinned disposable browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/tos-browser-deps" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/tos-browser-deps/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Original, G3/G4.1, M5, superset-skip and offline browser gates
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tos-browser-deps/node_modules/playwright
        run: |
          node tests/storage_g3_browser.test.js --original-suite
          node tests/storage_g3_browser.test.js
          node tests/m5_load_browser.test.js
          node tests/m5_scroll_browser.test.js
          node tests/superset_skip_browser.test.js
          node tests/offline_browser.test.js
