name: Release Training OS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "version.json"
      - "manifest.webmanifest"
      - "training-os-loop-v1-*.png"
      - "scripts/validate_release.py"
      - "scripts/test_engine.js"
      - "scripts/test_ui_static.js"
      - "scripts/release.sh"
      - ".github/workflows/release-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: training-os-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Validate release
        run: python scripts/validate_release.py

      - name: Test training engine
        run: node scripts/test_engine.js

      - name: Test UI static integrity
        run: node scripts/test_ui_static.js

      - name: Build deploy artifact
        run: |
          rm -rf _site
          mkdir _site
          cp index.html version.json manifest.webmanifest _site/
          cp training-os-loop-v1-180.png _site/
          cp training-os-loop-v1-192.png _site/
          cp training-os-loop-v1-512.png _site/
          cp training-os-loop-v1-1024.png _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
