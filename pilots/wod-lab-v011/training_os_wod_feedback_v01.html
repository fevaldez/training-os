<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6fa"><title>Training OS · Feedback V0.1</title><style>
:root{--ink:#182132;--muted:#677184;--blue:#2865e7;--bg:#f5f6fa;--line:#e4e8ef;--safe:env(safe-area-inset-bottom)}*{box-sizing:border-box}body{background:var(--bg);margin:0;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}main{max-width:640px;margin:auto;padding:18px 18px calc(40px + var(--safe))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:13px;font-weight:850;letter-spacing:.09em}.switch{display:flex;gap:3px;border-radius:12px;padding:3px;background:#e6eaf1}.switch button{min-width:46px;min-height:44px;border:0;background:transparent;border-radius:9px;font-weight:800;color:var(--muted)}.switch button.active{background:white;color:var(--ink)}h1{font-size:clamp(30px,8vw,42px);line-height:1.09;letter-spacing:-.045em;margin:0 0 13px}h2{font-size:17px;margin:0 0 13px}p{margin:0;color:var(--muted)}.goal{background:linear-gradient(135deg,#17243b,#293b69);border-radius:25px;color:#fff;padding:25px;margin-bottom:15px}.goal p{color:#cbd7ed;font-size:13px;letter-spacing:.08em;font-weight:800;margin-bottom:9px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px;margin-top:13px}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.rating button{min-width:44px;min-height:50px;border:1px solid #dae1ed;background:#f6f8fb;color:var(--ink);font-weight:800;font-size:17px;border-radius:13px}.rating button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:white}.hint{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted);gap:12px}label{font-size:14px;font-weight:750;display:block;margin:7px 0 6px}select,textarea{font:inherit;width:100%;border-radius:13px;padding:11px;border:1px solid #dce1ea;background:#fff;color:var(--ink);min-height:48px}textarea{min-height:85px;resize:vertical}.btn{min-height:50px;border-radius:14px;border:0;padding:12px 16px;background:var(--blue);color:white;font-weight:800;font:inherit;cursor:pointer}.btn.secondary{background:#e9eef8;color:#2559ad}.btn.full{width:100%;margin-top:15px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.note{font-size:13px;margin-top:15px}.hidden{display:none}.summary{white-space:pre-wrap;background:#f3f6fb;border-radius:12px;padding:14px;font-size:13px;overflow-wrap:anywhere}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8bb2ff;outline-offset:2px}@media(max-width:360px){main{padding-inline:12px}.panel{padding:14px}.rating{gap:5px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><header class="top"><div class="brand">◈ TRAINING OS · WOD LAB</div><div class="switch" role="group" aria-label="Idioma / Language"><button data-lang="es" type="button">ES</button><button data-lang="en" type="button">EN</button></div></header><div id="app"></div></main><script>
(()=>{'use strict';const K='training-os.wod-lab.locale';let lang='es';try{lang=localStorage.getItem(K)==='en'?'en':'es'}catch(_){}const T=(es,en)=>lang==='en'?en:es,answers={},metrics=[['ease',['¿La app fue fácil de usar?','Was the app easy to use?'],['Difícil','Hard'],['Muy fácil','Very easy']],['challenge',['¿Qué tan exigente fue?','How challenging was it?'],['Muy fácil','Too easy'],['Muy difícil','Too hard']],['variety',['¿Te gustaron los entrenamientos?','Did you enjoy the workouts?'],['Nada','Not at all'],['Mucho','Very much']],['repeat',['¿Quieres seguir usándola?','Would you keep using it?'],['No','No'],['Sí','Yes']]];let formValues={favorite:'',note:''},output='';const app=document.querySelector('#app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function langSet(x){formValues.favorite=document.querySelector('#favorite')?.value??formValues.favorite;formValues.note=document.querySelector('#note')?.value??formValues.note;lang=x;document.documentElement.lang=lang;try{localStorage.setItem(K,lang)}catch(_){}render()}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(x=>{x.classList.toggle('active',x.dataset.lang===lang);x.setAttribute('aria-pressed',String(x.dataset.lang===lang))});app.innerHTML=`<section class="goal"><p>${T('TU EXPERIENCIA','YOUR EXPERIENCE')}</p><h1>${T('¿Quieres repetir?','Would you train again?')}</h1><span>${T('4 respuestas. 1 minuto.','4 ratings. 1 minute.')}</span></section>${metrics.map(([id,q,low,high])=>`<section class="panel"><h2>${q[lang==='en'?1:0]}</h2><div class="rating" role="group" aria-label="${q[lang==='en'?1:0]}">${[1,2,3,4,5].map(n=>`<button type="button" data-key="${id}" data-value="${n}" aria-pressed="${answers[id]===n}">${n}</button>`).join('')}</div><div class="hint"><span>${low[lang==='en'?1:0]}</span><span>${high[lang==='en'?1:0]}</span></div></section>`).join('')}<section class="panel"><label for="favorite">${T('Formato favorito','Favorite format')}</label><select id="favorite"><option value="">${T('Opcional','Optional')}</option>${[['AMRAP','AMRAP'],['EMOM','EMOM'],['Fuerza','Strength'],['HIIT','HIIT'],['Peso corporal','Bodyweight'],['Otro','Other']].map(([es,en])=>`<option value="${es}" ${formValues.favorite===es?'selected':''}>${lang==='en'?en:es}</option>`).join('')}</select><label for="note">${T('¿Qué cambiarías?','What would you change?')}</label><textarea id="note" maxlength="800" placeholder="${T('Una idea concreta','One specific idea')}">${esc(formValues.note)}</textarea></section><button class="btn full" id="build">${T('Crear resumen','Generate summary')}</button><div class="panel ${output?'':'hidden'}" id="result"><h2>${T('Listo para compartir','Ready to share')}</h2><div class="summary" id="summary">${esc(output)}</div><div class="actions"><button class="btn secondary" id="copy">${T('Copiar','Copy')}</button><button class="btn secondary" id="download">${T('Descargar .txt','Download .txt')}</button></div></div><p class="note">${T('Privado. No se envía nada automáticamente.','Private. Nothing is sent automatically.')}</p>`}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang){langSet(b.dataset.lang);return}if(b.dataset.key){answers[b.dataset.key]=Number(b.dataset.value);render();return}if(b.id==='build'){formValues.favorite=document.querySelector('#favorite').value;formValues.note=document.querySelector('#note').value;if(metrics.some(x=>!answers[x[0]])){alert(T('Responde las 4 preguntas.','Rate all 4 questions.'));return}output=[T('Training OS · Evaluación','Training OS · Feedback'),new Date().toLocaleDateString(lang==='en'?'en-US':'es-MX'),...metrics.map(([id,q])=>q[lang==='en'?1:0]+': '+answers[id]+'/5'),T('Formato','Format')+': '+(formValues.favorite||'—'),T('Nota','Note')+': '+(formValues.note||'—')].join('\n');render();document.querySelector('#result').scrollIntoView({block:'nearest'});return}if(b.id==='copy'){try{await navigator.clipboard.writeText(output);b.textContent=T('Copiado','Copied')}catch(_){alert(T('Usa Descargar .txt.','Use Download .txt.'))}return}if(b.id==='download'){const blob=new Blob([output],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='training-os-wod-feedback-v01.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});document.addEventListener('change',e=>{if(e.target.id==='favorite')formValues.favorite=e.target.value});document.addEventListener('input',e=>{if(e.target.id==='note')formValues.note=e.target.value});window.__FEEDBACK_TEST__={answers,langSet};render();})();
</script></body></html>
