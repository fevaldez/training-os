function segments(w){let v=[{kind:'warm',label:'Calentamiento',seconds:w.warm*60}];if(w.type==='EMOM'){for(let n=0;n<w.main;n++)v.push({kind:'emom',label:w.moves[n%w.moves.length][0],seconds:60,station:n+1,cycle:Math.floor(n/w.moves.length)+1,move:n%w.moves.length});}else if(w.type==='HIIT'){let elapsed=0,i=0;while(elapsed<w.main*60){let step=Math.min(w.work,w.main*60-elapsed);v.push({kind:'effort',label:'Esfuerzo controlado',seconds:step,cycle:i+1});elapsed+=step;if(elapsed>=w.main*60)break;step=Math.min(w.rest,w.main*60-elapsed);v.push({kind:'recovery',label:'Recuperación',seconds:step,cycle:i+1});elapsed+=step;i++;}}else v.push({kind:'main',label:w.type==='AMRAP'?'AMRAP · Rondas':w.type==='Fuerza'?'Bloque de fuerza':'Ritmo conversacional',seconds:w.main*60});v.push({kind:'cool',label:'Vuelta a la calma',seconds:w.cool*60});return v}
function remaining(s,now=Date.now()){return s.status==='running'?Math.max(0,s.deadline-now):Math.max(0,s.leftMs||0)}
function guided(s,now=Date.now()){return s.guidedMs+(s.status==='running'?Math.min(s.liveInitial,Math.max(0,now-s.liveAt)):0)}
function shift(s,at,reason,elapsedOverride){let seg=s.segments[s.idx],actual=elapsedOverride??Math.min(s.liveInitial,Math.max(0,at-s.liveAt));s.guidedMs+=actual;s.records.push({segment:s.idx,kind:seg.kind,action:reason,elapsedMs:actual+(s.phaseMs||0),time:new Date(at).toISOString()});if(reason==='skip'||reason==='early')s.early=true;s.phaseMs=0;s.idx++;if(s.idx>=s.segments.length){s.status='ready';s.deadline=null;s.leftMs=0;return}let dur=s.segments[s.idx].seconds*1000;s.liveAt=at;s.liveInitial=dur;s.deadline=at+dur;s.leftMs=dur;s.status='running'}
function catchUp(){if(!session||session.status!=='running')return false;let now=Date.now(),changed=false;for(let i=0;i<300&&session.status==='running'&&now>=session.deadline;i++){const at=session.deadline;shift(session,at,'timer',session.liveInitial);changed=true;}if(changed)persist();return changed}
function sessionActionOriginal(action){if(!session)return;catchUp();let s=session,now=Date.now();if(action==='pause'&&s.status==='running'){s.phaseMs=(s.phaseMs||0)+Math.min(s.liveInitial,Math.max(0,now-s.liveAt));s.guidedMs+=Math.min(s.liveInitial,Math.max(0,now-s.liveAt));s.leftMs=remaining(s,now);s.status='paused';s.deadline=null;}else if(action==='resume'&&s.status==='paused'){s.status='running';s.liveAt=now;s.liveInitial=s.leftMs;s.deadline=now+s.leftMs;}else if((action==='next'||action==='skip')&&['running','paused'].includes(s.status)){const reason=action==='skip'?'skip':'early',wasPaused=s.status==='paused';shift(s,now,reason,wasPaused?0:undefined);if(wasPaused&&s.status==='running'){s.leftMs=s.segments[s.idx].seconds*1000;s.liveInitial=s.leftMs;s.liveAt=now;s.deadline=null;s.status='paused';}}else if(action==='cool'&&['running','paused'].includes(s.status)){const wasPaused=s.status==='paused';let until=s.segments.findIndex((g,i)=>i>=s.idx&&g.kind==='cool');if(until<0)return;if(s.status==='running'){s.guidedMs+=Math.min(s.liveInitial,Math.max(0,now-s.liveAt))}s.records.push({segment:s.idx,action:'early',kind:s.segments[s.idx].kind,elapsedMs:(s.phaseMs||0)+(s.status==='running'?Math.min(s.liveInitial,Math.max(0,now-s.liveAt)):0)});s.phaseMs=0;for(let i=s.idx+1;i<until;i++)s.records.push({segment:i,action:'skip',kind:s.segments[i].kind,elapsedMs:0});s.early=true;s.idx=until;s.status='running';s.liveAt=now;s.leftMs=s.segments[until].seconds*1000;s.liveInitial=s.leftMs;s.deadline=now+s.leftMs;if(wasPaused){s.deadline=null;s.status='paused';}}else if(action==='finish'&&['running','paused'].includes(s.status)){if(s.status==='running')s.guidedMs+=Math.min(s.liveInitial,Math.max(0,now-s.liveAt));s.records.push({segment:s.idx,kind:s.segments[s.idx].kind,action:'early',elapsedMs:(s.phaseMs||0)+(s.status==='running'?Math.min(s.liveInitial,Math.max(0,now-s.liveAt)):0)});s.phaseMs=0;s.early=true;s.status='ready';s.deadline=null;s.leftMs=0;}else if(action==='round'&&s.status==='running'&&currentStage(s).kind==='main'&&s.workout.type==='AMRAP'){s.rounds++}else if(action==='set'&&s.status==='running'&&currentStage(s).kind==='main'&&s.workout.type==='Fuerza'){s.sets++}else if(action==='move'&&['running','paused'].includes(s.status)){s.exerciseIdx=(s.exerciseIdx+1)%s.workout.moves.length}else if(action==='skipmove'&&['running','paused'].includes(s.status)){s.skippedMoves.push(s.exerciseIdx);s.exerciseIdx=(s.exerciseIdx+1)%s.workout.moves.length;s.early=true}else if(action==='discard'){if(!confirm(L('¿Descartar sesión sin guardar?','Discard without saving?')))return;session=null;route='home';persist();render();return}else return;persist();render()}
function fmt(ms){let sec=Math.ceil(Math.max(0,ms)/1000),m=Math.floor(sec/60);return `${String(m).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function currentStage(s){return s.segments[Math.min(s.idx,s.segments.length-1)]}






function render(){document.body.classList.toggle('player-mode',route==='player');navRender();window.clearInterval(timer);timer=null;switch(route){case 'home':el.innerHTML=home();break;case 'library':el.innerHTML=library();break;case 'saved':el.innerHTML=library(true);break;case 'detail':el.innerHTML=detail();break;case 'builder':el.innerHTML=builder();break;case 'player':el.innerHTML=player();break;case 'progress':el.innerHTML=progress();break;default:route='home';el.innerHTML=home();}if(route==='player'&&session&&session.status==='running'){timer=setInterval(()=>{const p=catchUp();if(p){render();return}const c=$('#clock'),bar=$('#progressBar'),g=$('#guidedLabel');if(c)c.textContent=fmt(remaining(session));if(g)g.textContent=`${Math.floor(guided(session)/60000)} ${L('min guiados','guided min')}`;if(bar){let d=session.segments.reduce((v,x)=>v+x.seconds*1000,0);bar.style.width=`${Math.min(100,guided(session)/d*100)}%`}},250)}}

function stageName(s,g){if(g.kind==='warm')return L('Calentamiento','Warm-up');if(g.kind==='cool')return L('Vuelta a la calma','Cool-down');if(g.kind==='effort')return L('Esfuerzo','Work');if(g.kind==='recovery')return L('Recuperación','Recovery');if(g.kind==='emom')return `EMOM · ${L('Minuto','Minute')} ${g.station}/${s.workout.main}`;if(g.kind==='main')return label(s.workout.type)==='AMRAP'?L('Rondas','Rounds'):s.workout.type==='Fuerza'?L('Fuerza','Strength'):L('Ritmo suave','Easy pace');return g.label}
function player(){if(!session)return `<div class="blank">${L('Sin sesión activa.','No active workout.')}</div>`;catchUp();const s=session,w=s.workout,g=currentStage(s);if(s.status==='ready')return finishScreen();const left=remaining(s),total=s.segments.reduce((a,b)=>a+b.seconds,0)*1000,progress=Math.min(100,Math.max(0,guided(s)/total*100));const next=s.segments[s.idx+1],inMain=!['warm','cool'].includes(g.kind);let instruction=g.kind==='warm'?L('Movilidad y práctica. Comienza suave.','Mobilize and rehearse. Start easy.'):g.kind==='cool'?L('Baja el ritmo. Respira.','Slow down. Breathe.'):g.kind==='effort'?L('Fuerte, sin perder control.','Push, stay in control.'):g.kind==='recovery'?L('Baja intensidad. Recupera aire.','Slow down. Recover.'):g.kind==='emom'?mc(w,g.move):w.type==='Fuerza'?L('Registra series y avanza cuando estés listo.','Log sets. Move on when ready.'):L('Completa rondas con buena técnica.','Complete rounds with solid form.');
let mainUI='';if(g.kind==='main'&&w.type==='AMRAP'){mainUI=`<div class="focused"><b>${s.rounds} ${L('rondas','rounds')}</b> · ${esc(mn(w,s.exerciseIdx))}</div><div class="two">${btn(L('＋ Ronda','＋ Round'),'round','btn compact')}${btn(L('Ejercicio siguiente','Next movement'),'move','btn light compact')}</div>`}else if(g.kind==='main'&&w.type==='Fuerza'){mainUI=`<div class="focused"><b>${s.exerciseIdx+1}/${w.moves.length}</b> · ${esc(mn(w,s.exerciseIdx))} <span class="dose">${esc(dose(w,s.exerciseIdx))}</span><small>${esc(mc(w,s.exerciseIdx))}</small></div><div class="two">${btn(L(`＋ Serie (${s.sets})`,`＋ Set (${s.sets})`),'set','btn compact')}${btn(L('Ejercicio siguiente','Next movement'),'move','btn light compact')}${btn(L('Omitir ejercicio','Skip movement'),'skipmove','btn ghost compact')}</div>`}else if(g.kind==='emom'){mainUI=`<div class="focused"><b>${esc(mn(w,g.move))}</b> · ${esc(dose(w,g.move))}<small>${esc(mc(w,g.move))}</small></div>`}else if(g.kind==='main'&&w.type==='Recuperación'){mainUI=`<div class="focused"><b>${esc(mn(w,0))}</b></div>`}
let pause=s.status==='paused';return `<section class="player"><div class="player-head"><button class="linkbtn" data-action="goto:home">← ${L('Hoy','Today')}</button>${miniLang()}<span class="${pause?'resume-tag':'pill green'}">${pause?L('EN PAUSA','PAUSED'):L('EN CURSO','IN PROGRESS')}</span></div><div class="eyebrow live-workout-name">${esc(wt(w))} · ${esc(label(w.type))}</div><div class="phasebox"><div class="eyebrow">${inMain?L('ENTRENAR','TRAIN'):g.kind==='warm'?L('PREPARAR','PREPARE'):L('RECUPERAR','RECOVER')} · ${s.idx+1}/${s.segments.length}</div><h2 id="phaseLabel">${esc(stageName(s,g))}</h2><div class="clock" id="clock" role="timer" aria-live="off">${fmt(left)}</div><div class="progress-track" aria-label="${L('Progreso','Progress')}"><div id="progressBar" style="width:${progress}%"></div></div><div class="phaseextra"><span id="nextLabel">${next?`${L('Sigue','Next')}: ${esc(stageName(s,next))}`:L('Sigue: resumen','Next: summary')}</span><span id="guidedLabel">${Math.floor(guided(s)/60000)} ${L('min guiados','guided min')}</span></div></div><div class="livebody"><div class="coach-line"><strong>${L('AHORA','NOW')}</strong><span>${esc(instruction)}</span></div>${mainUI}${inMain&&w.type!=='HIIT'&&w.type!=='EMOM'?`<details class="movement-disclosure"><summary>${L('Ver movimientos','View movements')}</summary><div class="moves">${w.moves.map((m,i)=>`<div class="move"><b>${esc(mn(w,i))}</b><span class="dose">${esc(dose(w,i))}</span></div>`).join('')}</div></details>`:''}</div><div class="live-controls"><button class="btn light wide" data-action="${pause?'resume':'pause'}">${icon(pause?'play':'pause',17)} ${pause?L('Reanudar','Resume'):L('Pausar','Pause')}</button><button class="btn wide" data-action="next">${icon('arrow',17)} ${L('Siguiente','Next')}</button><div class="fine"><button data-action="skip">${L('Omitir','Skip')}</button><button data-action="cool">${L('Enfriar','Cool down')}</button><button data-action="finish" class="finish-action">${L('Finalizar','Fini function finishScreen(){const s=session,w=s.workout,guidedM=Math.round(s.guidedMs/60000),sk=s.records.filter(x=>x.action==='skip').length+s.skippedMoves.length,early=s.early||sk>0;return `<section class="player"><div class="panel completion"><span class="pill green">${icon('check',16)} ${L('LISTO','DONE')}</span><h1>${early?L('Sesión parcial','Partial workout'):L('Sesión terminada','Workout complete')}</h1><div class="summarygrid"><div class="metric"><strong>${guidedM}'</strong><small>${L('Min guiados','Guided min')}</small></div><div class="metric"><strong>${s.rounds||s.sets||'—'}</strong><small>${w.type==='AMRAP'?L('Rondas','Rounds'):w.type==='Fuerza'?L('Series','Sets'):L('Conteo','Count')}</small></div><div class="metric"><strong>${sk}</strong><small>${L('Omisiones','Skips')}</small></div></div><div class="action-after">${btn(`${icon('check',18)} ${early?L('Guardar parcial','Save partial'):L('Guardar sesión','Save workout')}`,'save-session','btn wide')}</div><div class="action-after">${btn(L('Descartar','Discard'),'discard','linkbtn')}</div></div></section>`}

function equipmentPanel(){return `<details class="panel wide-space"><summary>${L('Equipo disponible y seguridad','Available equipment & safety')}</summary><p>${L('Solo marca equipo seguro que sabes usar. Cambia planes futuros; la semana publicada permanece fija. Si falta equipo, el inicio se bloquea.','Select only safe equipment you know how to use. Affects future plans; the published week stays fixed. Start is blocked if equipment is missing.')}</p><div class="filters">${C.equipment.map(e=>`<label class="equipment-choice"><input type="checkbox" data-equipment="${esc(e)}" ${data.equipment.includes(e)?'checked':''}> ${esc(label(e))}</label>`).join('')}</div><p>${L('Dominadas: solo barra certificada y fijada, sin kipping. Sustituye explícitamente por remo con mancuerna al crear el WOD. Nunca uses un rack o banco como barra improvisada. Para dolor o lesión, detente y adapta con un profesional.','Pull-ups: rated, secured bar only, no kipping. Explicitly substitute dumbbell rows when creating the WOD. Never improvise a pull-up bar from a rack or bench. Stop for pain or injury and adapt with a professional.')}</p></details>`}
function banner(){return fallback||blocked?`<div class="notice warn" role="alert">${L('Guardado bloqueado o fallido; los datos originales se conservan. Exporta recuperación y recarga antes de reintentar.','Saving blocked or failed; original data is retained. Export recovery and reload before retrying.')} ${esc(storeError)} ${btn(L('Exportar recuperación','Export recovery'),'raw-export','btn light')}</div>`:''}
function begin(id){const w=lookup(id);if(!w||blocked)return;if(session){routeTo('player');return}if(!C.safe(w,data.equipment)){toast(L('Falta equipo seguro. Revisa Equipo disponible o elige otro WOD.','Safe equipment missing. Check Available equipment or choose another WOD.'));return}
 const now=Date.now(),p=String(id).startsWith('plan@')?data.plans[String(id).split('@')[1]]:null,slot=p?.slots[Number(String(id).split('@')[2])];
 if(!transaction(()=>{session={id:crypto.randomUUID(),workout:C.copy(w),segments:segments(w),idx:0,status:'running',deadline:now+w.warm*60000,leftMs:w.warm*60000,liveAt:now,liveInitial:w.warm*60000,guidedMs:0,phaseMs:0,ledgerVersion:2,startedAt:new Date(now).toISOString(),records:[],rounds:0,sets:0,exerciseIdx:0,skippedMoves:[],early:false,strengthLogs:[],intervals:[],benchmarkContext:'',planWeek:p?.week||null,planSlot:slot?.id||null,optional:slot?.optional||false}}))return;
 routeTo('player')}
function saveSession(){if(!session||session.status!=='ready')return;const s=C.copy(session);if(data.history.some(h=>h.id===s.id)){if(transaction(()=>{session=null}))routeTo('progress');return}
 const completed=!s.early&&s.guidedMs>=C.total(s.workout)*60000,context=s.comparisonInvalid?null:s.benchmarkContext?.trim();
 const entry={id:s.id,workoutId:s.workout.id,name:s.workout.title,type:s.workout.type,benefit:s.workout.benefit,plannedM:duration(s.workout),guidedSeconds:Math.floor(s.guidedMs/1000),rounds:s.rounds,sets:s.sets,skips:s.records.filter(x=>x.action==='skip').length+s.skippedMoves.length,early:!completed,completedAt:new Date().toISOString(),difficulty:null,liked:null,notes:'',records:s.records,workout:s.workout,ledgerVersion:s.ledgerVersion,planWeek:s.planWeek,planSlot:s.planSlot,optional:s.optional,strengthLogs:s.strengthLogs||[],benchmarkKey:context?C.fingerprint(s.workout,context):null,benchmarkScore:completed&&context?(s.workout.type==='AMRAP'?s.rounds:s.workout.type==='EMOM'?(s.intervals||[]).length:null):null};
 if(transaction(()=>{data.history.unshift(entry);session=null})){routeTo('progress');toast(L('Sesión guardada.','Workout saved.'))}}
function toggleFav(id){if(!lookup(id))return;transaction(()=>{data.favorites=isFav(id)?data.favorites.filter(x=>x!==id):[...data.favorites,id]});render()}
function updateRating(id,v,type){transaction(()=>{const h=data.history.find(x=>x.id===id);if(h){if(type==='rate')h.difficulty=v;else h.liked=v}});render()}
function deleteWod(id){if(!lookup(id)?.custom||!confirm(L('¿Eliminar de la biblioteca? Se conservan planes, sesiones e historial.','Remove from library? Plans, sessions and history are retained.')))return;if(transaction(()=>{data.custom=data.custom.filter(x=>x.id!==id);data.favorites=data.favorites.filter(x=>x!==id)}))routeTo('library')}
function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportJSON(){download({format:'training-os-wod',formatVersion:2,exportedAt:new Date().toISOString(),origin:location.origin,locale,state:{...data,active:session},preV02:localStorage.getItem(C.BACKUP)},'training-os-wod-v02-backup.json');toast(L('Respaldo generado, incluye sesión actual.','Backup generated, including current session.'))}
function exportRaw(){let raw;try{raw={stored:localStorage.getItem(KEY),preV02:localStorage.getItem(C.BACKUP)}}catch(e){raw={error:e.message}}download({...raw,memory:{...data,active:session}},'training-os-wod-recovery.json')}
function restore(file){if(!file)return;if(file.size>10000000){toast(L('Archivo demasiado grande.','File too large.'));return}const rd=new FileReader();rd.onload=()=>{try{if(blocked)throw Error('storage-blocked');const v=JSON.parse(rd.result);if(v.format&&(v.format!=='training-os-wod'||v.formatVersion!==2))throw Error('format');const incoming=v.format?v.state:v,candidate=C.merge({...data,active:session},incoming);if(typeof v.preV02==='string'&&!candidate.sourceBackups.includes(v.preV02))candidate.sourceBackups.push(v.preV02);if(!confirm(L('¿Combinar respaldo? No reemplaza historial. Los conflictos de ID o sesión se rechazan; planes distintos se archivan.','Merge backup? History is retained. ID or session conflicts are rejected; different plans are archived.')))return;
 if(transaction(()=>{data=candidate;session=data.active})){if(['es','en'].includes(v.locale)){locale=v.locale;try{localStorage.setItem(LOCALE_KEY,locale)}catch(_){}}routeTo('progress');toast(L('Respaldo combinado sin duplicados.','Backup merged without duplicates.'))}}catch(e){toast(L('No se importó; datos conservados. ','Import rejected; data retained. ')+e.message)}finally{const f=$('#importFile');if(f)f.value=''}};rd.readAsText(file)}
function builder(){let h=builderOld();const extra=`<div class="field full"><h3>${L('Ejercicios reutilizables','Reusable exercises')}</h3><p>${L('Añade uno por uno. Las líneas libres también se guardan, pero no entran al plan automático.','Add one at a time. Free-form lines are saved too, but are excluded from automatic plans.')}</p><label for="exerciseSelect">${L('Ejercicio','Exercise')}</label><select id="exerciseSelect">${exerciseList().map(e=>`<option value="${esc(e.id)}">${esc(e.names[locale==='en'?1:0])} · ${esc(e.equipment.map(label).join(', ')||L('Sin equipo','No equipment'))}</option>`).join('')}</select><label for="exerciseDose">${L('Prescripción: series, repeticiones, descanso y tempo','Prescription: sets, reps, rest and tempo')}</label><input id="exerciseDose" value="8 rep" maxlength="120"><label><input id="subPullup" type="checkbox"> ${L('Sustituir dominada por remo con mancuerna (requiere mancuerna)','Substitute pull-up with dumbbell row (requires dumbbell)')}</label><button type="button" class="btn light" id="addExercise">${L('Añadir ejercicio','Add exercise')}</button><label><input name="eligible" type="checkbox"> ${L('Prescripción revisada: apta para planes futuros de 45 min','Prescription reviewed: eligible for future 45-minute plans')}</label></div>`;
 return h.replace('<div class="field full"><label for="wmoves">',extra+'<div class="field full"><label for="wmoves">')+exerciseEditor()}
function exerciseEditor(){return `<details class="panel wide-space"><summary>${L('Crear ejercicio reutilizable','Create reusable exercise')}</summary><form id="exerciseForm" class="formgrid"><div class="field"><label for="exEs">${L('Nombre ES','ES name')}</label><input id="exEs" required maxlength="80"></div><div class="field"><label for="exEn">${L('Nombre EN','EN name')}</label><input id="exEn" required maxlength="80"></div><div class="field full"><label for="exEquip">${L('Equipo requerido (selección múltiple)','Required equipment (multiple selection)')}</label><select id="exEquip" multiple>${C.equipment.map(e=>`<option value="${e}">${esc(label(e))}</option>`).join('')}</select></div><div class="field"><label for="cueEs">${L('Técnica y seguridad ES','Technique & safety ES')}</label><input id="cueEs" required maxlength="240"></div><div class="field"><label for="cueEn">${L('Técnica y seguridad EN','Technique & safety EN')}</label><input id="cueEn" required maxlength="240"></div><div class="field full"><label><input id="exSafe" type="checkbox" required> ${L('Confirmo equipo seguro y movimiento sin dolor. No usar anclajes improvisados.','I confirm safe equipment and pain-free movement. No improvised anchors.')}</label><button class="btn" type="submit">${L('Guardar ejercicio','Save exercise')}</button></div></form></details>`}
let draftRefs=[];
function saveCustom(form){const fd=new FormData(form),name=String(fd.get('wname')||'').trim(),lines=String(fd.get('wmoves')||'').trim().split(/\n/).filter(Boolean);if(name.length<3||!lines.length||lines.length>18){toast(L('Revisa nombre y movimientos (máximo 18).','Check name and movements (maximum 18).'));return}
 const referenced=draftRefs.length===lines.length&&lines.every((l,i)=>l===draftRefs[i].line),refs=referenced?draftRefs:[],reviewed=fd.get('eligible')==='on';if(reviewed&&!referenced){toast(L('Usa ejercicios reutilizables para entrar al plan.','Use reusable exercises to enter the plan.'));return}
 const moves=lines.map((l,i)=>{const [n,d]=l.split('|').map(x=>x.trim());return [n,d||'8 rep',refs[i]?.exercise.cues[0]||L('Control y técnica.','Control and technique.')]});const equip=referenced?[...new Set(refs.flatMap(r=>r.exercise.equipment))]:String(fd.get('wequip')||'Peso corporal').split(',').map(x=>x.trim()).filter(Boolean);
 const w={...mk('custom-'+crypto.randomUUID(),name,String(fd.get('wtype')),String(fd.get('wbenefit')),'Personalizado',equip.length?equip:['Peso corporal'],'Autoajustable',moves,String(fd.get('wdescription')||''),30),custom:true,reviewed,eligible:reviewed,exerciseIds:refs.map(r=>r.exercise.id),exerciseNames:refs.map(r=>r.exercise.names),exerciseCues:refs.map(r=>r.exercise.cues)};
 if(!C.workoutOK(w)){toast(L('Prescripción inválida.','Invalid prescription.'));return}if(transaction(()=>data.custom.unshift(w))){draftRefs=[];detailId=w.id;routeTo('detail')}}
function progress(){const m=C.metrics(data);let html=progressOld();html=html.replace('<input type="file" id="importFile" accept=".json,application/json" hidden>','<input type="file" id="importFile" accept=".json,application/json" aria-label="'+L('Importar respaldo JSON','Import JSON backup')+'">');return html+goalPanel(m)+`<div class="panel wide-space"><h2>${L('Mediciones comparables','Comparable measurements')}</h2><p>${L('La constancia mide actividad, no adaptación física. Comparamos solo la misma prescripción, variante y contexto de carga.','Consistency measures activity, not physical adaptation. Comparisons require the same prescription, variant and load context.')}</p>${m.comparisons.length?m.comparisons.slice(-10).map(x=>`<p>${esc(META[x.workoutId]?.title?.[locale==='en'?1:0]||x.name)}: ${x.previous} → ${x.score} ${x.type==='AMRAP'?L('rondas','rounds'):L('intervalos completados','completed intervals')} (${x.delta>=0?'+':''}${x.delta})</p>`).join(''):`<p>${L('Aún no hay resultados comparables de resistencia.','No comparable endurance results yet.')}</p>`}${m.strengthComparisons.length?m.strengthComparisons.slice(-10).map(x=>`<p>${esc(x.names?.[locale==='en'?1:0]||x.move)} · ${x.reps} ${L('rep','reps')}: ${x.kg} kg (${x.delta>=0?'+':''}${x.delta} kg)</p>`).join(''):`<p>${L('Aún no hay series de fuerza comparables. Registra repeticiones y kg con la misma variante.','No comparable strength sets yet. Log reps and kg with the same variant.')}</p>`}</div><div class="notice">${L('Migración entre orígenes HTTPS: exporta aquí, abre el destino e importa el JSON. Incluye sesión actual, ejercicios, planes e historial. Los conflictos de ID o sesión se rechazan sin reemplazar datos; conserva ambos archivos y resuelve antes de reintentar.','HTTPS origin migration: export here, open the destination and import the JSON. Includes current session, exercises, plans and history. ID or session conflicts are rejected without replacement; keep both files and resolve before retrying.')}</div>`}
const oldPlayer=player;player=function(){let h=oldPlayer();if(!session||session.status==='ready')return banner()+h;const s=session,g=currentStage(s),enabled=s.status==='running'&&!['warm','cool'].includes(g.kind);let extra=`<div class="panel wide-space"><label for="benchmarkContext">${L('Contexto comparable: carga, variante y escalado (sin datos personales)','Comparison context: load, variant and scaling (no personal data)')}</label><input id="benchmarkContext" ${(s.rounds||s.sets||s.intervals?.length||s.strengthLogs?.length)?'disabled':''} value="${esc(s.benchmarkContext||'')}" maxlength="200" placeholder="${L('Ej. sin carga, flexión de rodillas','e.g. no load, knee push-up')}"><p>${L('Debe coincidir exactamente en futuras mediciones. Se bloquea tras la primera medición.','Must match exactly in future measurements. Locked after the first measurement.')}</p>`;
 if(s.workout.type==='EMOM')extra+=`<button class="btn" data-action="interval" ${!enabled||g.kind!=='emom'||s.intervals?.includes(s.idx)?'disabled':''}>${L('Objetivo del minuto completado','Minute target completed')} (${s.intervals?.length||0})</button><p>${L('Reduce repeticiones para acabar antes de 40 s; descansa el resto del minuto.','Reduce reps to finish within 40 s; rest for the remainder of the minute.')}</p>`;
 if(s.workout.type==='Fuerza')extra+=`<div class="formgrid"><div class="field"><label for="setReps">${L('Repeticiones reales','Actual reps')}</label><input id="setReps" type="number" min="1" max="100" value="8"></div><div class="field"><label for="setKg">${L('Carga externa total (kg; 0 sin carga)','Total external load (kg; 0 for bodyweight)')}</label><input id="setKg" type="number" min="0" max="500" step="0.25" value="0"></div><div class="field full"><button class="btn" data-action="log-strength" ${!enabled?'disabled':''}>${L('Registrar serie medida del ejercicio actual','Log measured set for current exercise')}</button></div></div><p>${L('La serie medida se guarda por separado del contador de series. RPE 6–8; 2–3 repeticiones en reserva.','Measured sets are saved separately from the set counter. RPE 6–8; keep 2–3 reps in reserve.')}</p>`;
 return banner()+h+extra+'</div>'};
function logInterval(){catchUp();if(!session||session.status!=='running'||currentStage(session).kind!=='emom')return;transaction(()=>{if(!session.benchmarkContext?.trim())session.comparisonInvalid=true;session.intervals??=[];if(!session.intervals.includes(session.idx))session.intervals.push(session.idx)});render()}
function logStrength(){catchUp();const reps=Number($('#setReps')?.value),kg=Number($('#setKg')?.value),variant=session?.benchmarkContext?.trim();if(!session||session.status!=='running'||currentStage(session).kind!=='main'||session.workout.type!=='Fuerza'||!variant||!Number.isInteger(reps)||reps<1||reps>100||!Number.isFinite(kg)||kg<0||kg>500){toast(L('Revisa repeticiones, kg y contexto.','Check reps, kg and context.'));return}transaction(()=>{session.strengthLogs??=[];session.strengthLogs.push({move:session.workout.moves[session.exerciseIdx][0],names:[session.workout.exerciseNames?.[session.exerciseIdx]?.[0]||META[session.workout.id]?.moves?.[session.exerciseIdx]?.[0]||session.workout.moves[session.exerciseIdx][0],session.workout.exerciseNames?.[session.exerciseIdx]?.[1]||META[session.workout.id]?.moves?.[session.exerciseIdx]?.[1]||session.workout.moves[session.exerciseIdx][0]],reps,kg,variant})});render()}
const oldNav=navRender;navRender=function(){oldNav();nav.setAttribute('aria-label',L('Navegación principal','Main navigation'))};
document.addEventListener('change',e=>{if(e.target.dataset.equipment){const q=e.target.dataset.equipment;transaction(()=>{data.equipment=e.target.checked?[...new Set([...data.equipment,q])]:data.equipment.filter(x=>x!==q)});render()}if(e.target.id==='benchmarkContext'&&session){transaction(()=>{if((session.rounds||session.sets||session.intervals?.length||session.strengthLogs?.length)&&session.benchmarkContext!==e.target.value.trim())session.comparisonInvalid=true;session.benchmarkContext=e.target.value.trim()});}});
document.addEventListener('click',e=>{if(e.target.id==='addExercise'){let x=exerciseList().find(x=>x.id===$('#exerciseSelect').value);if(x?.id==='pullup'&&$('#subPullup').checked)x=exerciseList().find(x=>x.id==='dbrow');const d=$('#exerciseDose').value.trim();if(!x||!d)return;const line=x.names[0]+' | '+d;if(draftRefs.length>=18)return;draftRefs.push({exercise:C.copy(x),line});$('#wmoves').value=draftRefs.map(x=>x.line).join('\n')}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='exerciseForm'){const x={id:'exercise-'+crypto.randomUUID(),names:[$('#exEs').value.trim(),$('#exEn').value.trim()],cues:[$('#cueEs').value.trim(),$('#cueEn').value.trim()],equipment:[...$('#exEquip').selectedOptions].map(o=>o.value)};if(!e.target.reportValidity())return;if(transaction(()=>data.exercises.push(x)))render()}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue!==storedRaw){blocked=true;fallback=true;storeError=L('Otra pestaña cambió los datos; exporta y recarga.','Another tab changed the data; export and reload.');render()}});
window.__WOD_TEST__={BASE,getState:()=>({route,session,data,blocked,storeError}),tick:catchUp,segments,begin,action:sessionAction,save:saveSession,go:routeTo,exportState:()=>({...data,active:session}),plan:publishedPlan};render();
